
name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/mes/MES.slnx

      - name: Build solution
        run: >-
          dotnet build src/mes/MES.slnx
          --configuration Release
          --no-restore
          --warnaserror

      - name: Run automated tests
        run: >-
          dotnet test src/mes/MES.slnx
          --configuration Release
          --no-build
          --no-restore
          --verbosity normal
